<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Доставка еды</title><style>body{margin:0;background:#101319;color:#fff;font:16px system-ui}header{padding:26px 20px;background:#1b2029}h1{font-size:25px;margin:0 0 8px}.sub{color:#aeb6c4}main{padding:20px}select,input{box-sizing:border-box;width:100%;background:#252b35;color:white;border:1px solid #434b57;border-radius:12px;padding:15px;margin:8px 0 16px;font-size:16px}.card{padding:20px;background:#1b2029;border-radius:16px;margin:16px 0}.tag{color:#ffb347}small{color:#aeb6c4}</style></head><body><header><h1>🍔 Доставка еды</h1><div class="sub">Все предложения в одном месте</div></header><main><label>Ваш город</label><select id="city"><option>Мурманск</option><option>Североморск</option></select><input id="search" placeholder="Поиск: пицца, суши, бургеры…"><div class="card"><strong>Каталог готов к наполнению</strong><p class="sub" id="message">Мурманск: проверенные рестораны появятся после добавления официальных данных и ссылок.</p></div><div class="card"><div class="tag">Бесплатная первая версия</div><p>Мы не показываем выдуманные цены, время доставки или рестораны.</p><small>Версия 0.1 · Работает без интернета</small></div></main><script>const city=document.getElementById('city'),message=document.getElementById('message');city.onchange=()=>message.textContent=city.value+': проверенные рестораны появятся после добавления официальных данных и ссылок.';</script></body></html>
